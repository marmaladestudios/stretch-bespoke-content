# AUD-020: Cache-Control for static assets.
# Wired in the Dockerfile via:
#   COPY apache-caching.conf /etc/apache2/conf-available/caching.conf
#   RUN a2enconf caching && a2enmod expires headers
#
# Policy:
#   - Theme + uploads static assets: 1 year, immutable. Theme CSS/JS are
#     cache-busted by the ?ver= query string WordPress appends on enqueue
#     (theme Version header), uploads are content-addressed by filename.
#   - HTML: no-cache (always revalidate). WordPress page HTML must never be
#     heuristically cached by browsers/CDNs or stale pages outlive deploys.
#     WP Super Cache (AUD-012) keeps its own short max-age on pages it
#     serves; `setifempty` leaves any PHP-set Cache-Control untouched
#     (including core's logged-in no-store headers).

<IfModule mod_expires.c>
    ExpiresActive On
</IfModule>

# Long-lived static assets under the theme and uploads trees.
<LocationMatch "^/wp-content/(themes|uploads)/.+\.(css|js|mjs|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf)$">
    <IfModule mod_expires.c>
        ExpiresDefault "access plus 1 year"
    </IfModule>
    <IfModule mod_headers.c>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </IfModule>
</LocationMatch>

# Static .html files (e.g. the /bce demo bundle): always revalidate.
<LocationMatch "\.html?$">
    <IfModule mod_headers.c>
        Header set Cache-Control "no-cache"
    </IfModule>
</LocationMatch>

# PHP-generated HTML that sets no explicit policy: default to no-cache so
# clients revalidate instead of heuristically caching. setifempty means any
# Cache-Control already sent by WordPress/plugins wins.
<IfModule mod_headers.c>
    Header setifempty Cache-Control "no-cache" "expr=%{CONTENT_TYPE} =~ m|^text/html|"
</IfModule>
