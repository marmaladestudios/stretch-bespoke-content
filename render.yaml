services:
  - type: web
    name: stretch-creative
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Render's default TCP probe only checks that Apache accepts connections.
    # WordPress returns 500 when the in-container database is unavailable, so
    # use a non-page-cached REST probe to make database failures restart the
    # instance instead of leaving a permanently "healthy" error page online.
    healthCheckPath: /wp-json/wp/v2/types/post
    disk:
      name: wp-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: WORDPRESS_DB_HOST
        value: "localhost"
      - key: WORDPRESS_DB_USER
        value: "wordpress"
      # AUD-017: secrets are generated by Render at service creation, never committed.
      # The entrypoint syncs the MySQL app user / root password to these values.
      - key: WORDPRESS_DB_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: WORDPRESS_DB_NAME
        value: "wordpress"
      # AUD-012: WP Super Cache needs WP_CACHE. The webroot is NOT on the
      # persistent disk, so wp-config.php is regenerated by the official
      # entrypoint on every deploy and the plugin's one-time wp-config edit
      # would be lost. The official image evals this before wp-settings.php.
      - key: WORDPRESS_CONFIG_EXTRA
        value: "if ( ! defined( 'WP_CACHE' ) ) { define( 'WP_CACHE', true ); }"
